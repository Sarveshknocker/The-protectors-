# nginx reverse proxy hardening. Include inside the relevant server {} blocks (and the http {} parts where marked).

# ---- http {} context ----
# server_tokens off;
# limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
# limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;
# limit_conn_zone $binary_remote_addr zone=perip:10m;
# client_max_body_size 2m;
# client_body_timeout 10s; client_header_timeout 10s; send_timeout 10s; keepalive_timeout 15s;

# ---- server {} context (443) ----
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_tickets off;
ssl_stapling on;
ssl_stapling_verify on;

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
# Tailor to the site's real sources before enforcing; start with Content-Security-Policy-Report-Only if unsure.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

limit_req zone=general burst=40 nodelay;
limit_conn perip 50;
limit_req_status 429;

location ~ ^/(api/)?(auth|login|signup|password|otp) {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://app_upstream;
}

# Never serve dotfiles, VCS metadata, backups, env files.
location ~ /\.(?!well-known) { deny all; return 404; }
location ~* \.(env|bak|old|orig|sql|log|swp)$ { deny all; return 404; }

proxy_hide_header X-Powered-By;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;

